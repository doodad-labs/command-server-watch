name: Aggregate

on:
    schedule:
        - cron: "0 * * * *"
    workflow_dispatch: # Allow manual trigger

jobs:
    aggregate:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout workflow repository
              uses: actions/checkout@v4
              with:
                  ref: workflow
                  fetch-depth: 0

            - name: Checkout main branch (data repository)
              uses: actions/checkout@v4
              with:
                  ref: main
                  path: main-data
                  fetch-depth: 1

            - name: Copy existing data from main branch
              run: |
                  # Copy the data directory to out/data so aggregator can merge with it
                  mkdir -p out
                  cp -r main-data/data out/data || true

            - name: Setup Python
              uses: actions/setup-python@v4
              with:
                  python-version: "3.12"
                  cache: "pip"

            - name: Install dependencies
              run: pip install -r requirements.txt

            - name: Run Aggregate
              working-directory: src
              run: python -m aggregator

            - name: Checkout target repository
              uses: actions/checkout@v4
              with:
                  repository: doodad-labs/command-server-watch
                  ref: main
                  path: target-repo
                  token: ${{ secrets.BOT_PAT }}

            - name: Copy all generated files to target repository
              run: |
                  # Copy everything from out directory recursively
                  cp -r out/* target-repo/

                  # Remove the out directory itself if it gets copied
                  rm -rf target-repo/out

            - name: Configure Git
              run: |
                  cd target-repo
                  git config user.name "DoodadLabs [bot]"
                  git config user.email "admin@doodadlabs.org"

            - name: Commit and push all changes
              run: |
                  cd target-repo

                  # Add all files (new, modified, deleted)
                  git add -A

                  # Check if there are changes to commit
                  if git diff --staged --quiet; then
                    echo "No changes to commit"
                  else
                    # Get list of changed files for commit message
                    CHANGED_FILES=$(git diff --name-only --staged | head -10 | tr '\n' ', ' | sed 's/, $//')
                    COMMIT_MSG="Update C2 - $(date +'%Y-%m-%d %H:%M:%S')"
                    
                    git commit -m "$COMMIT_MSG"
                    git push
                  fi
